name: Actualizar campo de aire global

on:
  schedule:
    # Ejecuta cada 3 horas
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-air-field:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Descargar datos de viento y PM2.5
        run: npm run data:air

      - name: Hacer commit y push si hay cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/air-field.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el campo de aire. No se requiere commit."
          else
            git commit -m "data(air): actualizar campo de viento y PM2.5 [skip ci]"
            git push
          fi
